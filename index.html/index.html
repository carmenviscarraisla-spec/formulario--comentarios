<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de comentarios</title>
</head>
<body>

  <header>
    <h1> Formulario de Comentarios</h1>
    
  </header>

  <main>
    
    <form id="formulario" novalidate>
      <fieldset>
        <legend>Datos del comentario</legend>

        <div>
          <label for="nombre">Nombre</label><br>
          <input type="text" id="nombre" name="nombre" autocomplete="name">
          <p id="error-nombre" role="alert"></p>
        </div>

        <div>
          <label for="comentario">Comentario</label><br>
          <textarea id="comentario" name="comentario" rows="4" cols="40" maxlength="200"></textarea>
          <p><span id="contador">0</span>/200</p>
          <p id="error-comentario" role="alert"></p>
        </div>

        <button type="submit">Publicar comentario</button>
      </fieldset>
    </form>

   
    <section aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Comentarios agregados</h2>
      <p>Total: <span id="total" aria-live="polite">0</span></p>
      <ul id="lista">
        <li>Aún no hay comentarios.</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
